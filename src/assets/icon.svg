<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- خلفية كحلية متدرجة قطريًا -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c55a0" />
      <stop offset="0.4" stop-color="#1a3a76" />
      <stop offset="0.75" stop-color="#0e224c" />
      <stop offset="1" stop-color="#081633" />
    </linearGradient>
    <radialGradient id="glowTL" cx="0.3" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#6d9de0" stop-opacity="0.25" />
      <stop offset="1" stop-color="#6d9de0" stop-opacity="0" />
    </radialGradient>
    <!-- الإطار -->
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b7fd4" />
      <stop offset="0.5" stop-color="#59b7f2" />
      <stop offset="1" stop-color="#1f5fa8" />
    </linearGradient>
    <linearGradient id="frameIn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3ff" stop-opacity="0.85" />
      <stop offset="1" stop-color="#4a9be0" stop-opacity="0.55" />
    </linearGradient>
    <!-- الكرة: قاعدة + ملمس -->
    <radialGradient id="ball" cx="0.38" cy="0.26" r="0.9">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.5" stop-color="#f4f6f9" />
      <stop offset="0.82" stop-color="#c9d2de" />
      <stop offset="1" stop-color="#9dabbd" />
    </radialGradient>
    <radialGradient id="ballShade" cx="0.68" cy="0.75" r="0.75">
      <stop offset="0" stop-color="#3a4c66" stop-opacity="0.4" />
      <stop offset="1" stop-color="#3a4c66" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e3542" />
      <stop offset="1" stop-color="#0f1218" />
    </linearGradient>
    <radialGradient id="vign" cx="0.42" cy="0.3" r="0.85">
      <stop offset="0.5" stop-color="#0a1834" stop-opacity="0" />
      <stop offset="0.8" stop-color="#0a1834" stop-opacity="0.2" />
      <stop offset="1" stop-color="#0a1834" stop-opacity="0.45" />
    </radialGradient>
    <radialGradient id="hl" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <!-- التاج -->
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffeaa6" />
      <stop offset="0.5" stop-color="#f7c34a" />
      <stop offset="1" stop-color="#e09410" />
    </linearGradient>
    <linearGradient id="goldFace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffdf7e" />
      <stop offset="0.5" stop-color="#f3b428" />
      <stop offset="1" stop-color="#d89408" />
    </linearGradient>
    <clipPath id="ballClip"><circle cx="512" cy="420" r="240" /></clipPath>
  </defs>

  <!-- الخلفية -->
  <rect width="1024" height="1024" fill="url(#bg)" />
  <rect width="1024" height="1024" fill="url(#glowTL)" />

  <!-- الإطار المتوهج -->
  <rect x="18" y="18" width="988" height="988" rx="190" fill="none" stroke="url(#frame)" stroke-opacity="0.22" stroke-width="40" />
  <rect x="18" y="18" width="988" height="988" rx="190" fill="none" stroke="url(#frame)" stroke-opacity="0.5" stroke-width="20" />
  <rect x="18" y="18" width="988" height="988" rx="190" fill="none" stroke="url(#frameIn)" stroke-width="7" />

  <!-- هالة خلف الكرة -->
  <circle cx="512" cy="420" r="270" fill="#7fb4f0" opacity="0.06" />
  <circle cx="512" cy="420" r="256" fill="#7fb4f0" opacity="0.07" />

  <!-- الكرة -->
  <circle cx="512" cy="420" r="240" fill="url(#ball)" />
  <g clip-path="url(#ballClip)">
    <!-- الرقع -->
    <g fill="url(#panel)" stroke="url(#panel)" stroke-width="16" stroke-linejoin="round">
      <path d="M0 -105 L99.9 -32.4 L61.8 85.1 L-61.8 85.1 L-99.9 -32.4 Z" transform="translate(512 172) rotate(180)" />
      <path d="M0 -105 L99.9 -32.4 L61.8 85.1 L-61.8 85.1 L-99.9 -32.4 Z" transform="translate(763.1 351.4) rotate(-108)" />
      <path d="M0 -105 L99.9 -32.4 L61.8 85.1 L-61.8 85.1 L-99.9 -32.4 Z" transform="translate(666.8 645.6) rotate(-36)" />
      <path d="M0 -105 L99.9 -32.4 L61.8 85.1 L-61.8 85.1 L-99.9 -32.4 Z" transform="translate(357.2 645.6) rotate(36)" />
      <path d="M0 -105 L99.9 -32.4 L61.8 85.1 L-61.8 85.1 L-99.9 -32.4 Z" transform="translate(260.9 351.4) rotate(108)" />
    </g>
    <!-- الخماسي المركزي -->
    <path d="M512 325 L619.9 402.6 L578.8 530.1 L445.2 530.1 L404.1 402.6 Z" fill="url(#panel)" stroke="url(#panel)" stroke-width="20" stroke-linejoin="round" />
    <!-- خطوط الخياطة -->
    <g stroke="#9aa4b4" stroke-width="8" stroke-linecap="round" opacity="0.85" fill="none">
      <path d="M512 325 V220" />
      <path d="M619.9 402.6 L689.9 362.6" />
      <path d="M578.8 530.1 L621.4 571.4" />
      <path d="M445.2 530.1 L402.6 571.4" />
      <path d="M404.1 402.6 L334.1 362.6" />
    </g>
    <!-- ظل سفلي وأعلى لامعة -->
    <ellipse cx="380" cy="580" rx="220" ry="150" transform="rotate(-22 380 580)" fill="url(#ballShade)" />
    <ellipse cx="424" cy="280" rx="140" ry="95" transform="rotate(-24 424 280)" fill="url(#hl)" />
    <circle cx="512" cy="420" r="240" fill="url(#vign)" />
  </g>
  <circle cx="512" cy="420" r="240" fill="none" stroke="#8090a8" stroke-opacity="0.4" stroke-width="3" />

  <!-- التاج -->
  <g>
    <path d="M404 168 L412 96 L478 146 L512 66 L546 146 L612 96 L620 168 Z" fill="url(#goldFace)" stroke="#c4830a" stroke-width="9" stroke-linejoin="round" />
    <rect x="396" y="160" width="232" height="42" rx="13" fill="url(#gold)" stroke="#c4830a" stroke-width="6" />
    <circle cx="412" cy="82" r="15" fill="url(#gold)" stroke="#c4830a" stroke-width="3.5" />
    <circle cx="512" cy="50" r="16" fill="url(#gold)" stroke="#c4830a" stroke-width="3.5" />
    <circle cx="612" cy="82" r="15" fill="url(#gold)" stroke="#c4830a" stroke-width="3.5" />
    <ellipse cx="460" cy="182" rx="42" ry="9" fill="#fff" opacity="0.35" transform="rotate(-5 460 182)" />
    <path d="M414 100 L452 148" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity="0.4" />
  </g>

  <!-- ظل TiQ -->
  <g transform="translate(9 14)" fill="none" stroke="rgba(4,12,26,0.45)" stroke-width="94" stroke-linecap="round">
    <path d="M186 640 H384" />
    <path d="M285 640 V902" />
    <path d="M488 696 V902" />
    <circle cx="728" cy="774" r="150" />
    <path d="M800 872 L864 950" />
  </g>
  <circle cx="496" cy="601" r="53" fill="rgba(4,12,26,0.45)" />

  <!-- TiQ -->
  <g fill="none" stroke="#ffffff" stroke-width="94" stroke-linecap="round">
    <path d="M186 640 H384" />
    <path d="M285 640 V902" />
    <path d="M488 696 V902" />
  </g>
  <circle cx="488" cy="588" r="52" fill="#ffffff" />
  <g fill="none" stroke="#7ED957" stroke-width="94" stroke-linecap="round">
    <circle cx="728" cy="774" r="150" />
    <path d="M800 872 L864 950" />
  </g>
</svg>
