<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- خلفية كحلية متدرجة -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f74c0" />
      <stop offset="0.45" stop-color="#1d4080" />
      <stop offset="1" stop-color="#0a1c3a" />
    </linearGradient>
    <radialGradient id="bgLight" cx="0.28" cy="0.18" r="0.65">
      <stop offset="0" stop-color="#8fb7ff" stop-opacity="0.3" />
      <stop offset="1" stop-color="#8fb7ff" stop-opacity="0" />
    </radialGradient>
    <!-- الكرة -->
    <radialGradient id="ballBase" cx="0.36" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.55" stop-color="#f1f4f8" />
      <stop offset="0.85" stop-color="#c7d1dc" />
      <stop offset="1" stop-color="#a6b2c1" />
    </radialGradient>
    <linearGradient id="patch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#333844" />
      <stop offset="1" stop-color="#14171d" />
    </linearGradient>
    <radialGradient id="vignette" cx="0.4" cy="0.32" r="0.8">
      <stop offset="0.55" stop-color="#0a1428" stop-opacity="0" />
      <stop offset="0.82" stop-color="#0a1428" stop-opacity="0.18" />
      <stop offset="1" stop-color="#0a1428" stop-opacity="0.42" />
    </radialGradient>
    <radialGradient id="shadeBL" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10203c" stop-opacity="0.38" />
      <stop offset="1" stop-color="#10203c" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="hiTL" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <!-- التاج الذهبي -->
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a3" />
      <stop offset="0.55" stop-color="#f6c14a" />
      <stop offset="1" stop-color="#e29a12" />
    </linearGradient>
    <clipPath id="ballClip"><circle cx="512" cy="432" r="235" /></clipPath>
  </defs>

  <!-- الخلفية -->
  <rect width="1024" height="1024" fill="url(#bg)" />
  <rect width="1024" height="1024" fill="url(#bgLight)" />

  <!-- الإطار الأزرق المتوهج -->
  <g fill="none">
    <rect x="24" y="24" width="976" height="976" rx="185" stroke="#4699ff" stroke-opacity="0.16" stroke-width="34" />
    <rect x="24" y="24" width="976" height="976" rx="185" stroke="#50aaff" stroke-opacity="0.38" stroke-width="18" />
    <rect x="24" y="24" width="976" height="976" rx="185" stroke="#a3d4ff" stroke-opacity="0.8" stroke-width="6" />
  </g>

  <!-- توهج خلف الكرة -->
  <circle cx="512" cy="432" r="266" fill="#8cbeff" opacity="0.07" />
  <circle cx="512" cy="432" r="252" fill="#8cbeff" opacity="0.08" />

  <!-- الكرة -->
  <g>
    <circle cx="512" cy="432" r="235" fill="url(#ballBase)" />
    <g clip-path="url(#ballClip)">
      <!-- خطوط الخياطة -->
      <g stroke="#98a2b1" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.9">
        <path d="M512 340 L512 257" />
        <path d="M614.7 414.6 L678.4 377.9" />
        <path d="M575.5 535.4 L614.9 573.6" />
        <path d="M448.5 535.4 L409.1 573.6" />
        <path d="M409.3 414.6 L345.6 377.9" />
      </g>
      <!-- رقع الحواف (مقصوصة بدائرة الكرة) -->
      <g fill="url(#patch)" stroke="url(#patch)" stroke-width="14" stroke-linejoin="round">
        <path d="M0 -100 L95.1 -30.9 L58.8 80.9 L-58.8 80.9 L-95.1 -30.9 Z" transform="translate(512 180) rotate(-180)" />
        <path d="M0 -100 L95.1 -30.9 L58.8 80.9 L-58.8 80.9 L-95.1 -30.9 Z" transform="translate(751.7 354.1) rotate(-108)" />
        <path d="M0 -100 L95.1 -30.9 L58.8 80.9 L-58.8 80.9 L-95.1 -30.9 Z" transform="translate(660.1 635.9) rotate(-36)" />
        <path d="M0 -100 L95.1 -30.9 L58.8 80.9 L-58.8 80.9 L-95.1 -30.9 Z" transform="translate(363.9 635.9) rotate(36)" />
        <path d="M0 -100 L95.1 -30.9 L58.8 80.9 L-58.8 80.9 L-95.1 -30.9 Z" transform="translate(272.3 354.1) rotate(108)" />
      </g>
      <!-- الخماسي المركزي -->
      <path d="M512 340 L614.7 414.6 L575.5 535.4 L448.5 535.4 L409.3 414.6 Z" fill="url(#patch)" stroke="url(#patch)" stroke-width="18" stroke-linejoin="round" />
      <!-- الإضاءة والظل -->
      <ellipse cx="370" cy="590" rx="215" ry="150" transform="rotate(-24 370 590)" fill="url(#shadeBL)" />
      <ellipse cx="430" cy="298" rx="135" ry="92" transform="rotate(-22 430 298)" fill="url(#hiTL)" />
      <circle cx="512" cy="432" r="235" fill="url(#vignette)" />
    </g>
    <circle cx="512" cy="432" r="235" fill="none" stroke="#7c8ea6" stroke-opacity="0.45" stroke-width="3" />
  </g>

  <!-- التاج الذهبي (يجلس فوق الكرة) -->
  <g>
    <path d="M404 174 L410 108 L474 152 L512 80 L550 152 L614 108 L620 174 Z" fill="url(#gold)" stroke="#c8860b" stroke-width="10" stroke-linejoin="round" />
    <rect x="398" y="168" width="228" height="40" rx="14" fill="url(#gold)" stroke="#c8860b" stroke-width="6" />
    <circle cx="410" cy="94" r="14" fill="url(#gold)" stroke="#c8860b" stroke-width="3" />
    <circle cx="512" cy="62" r="15" fill="url(#gold)" stroke="#c8860b" stroke-width="3" />
    <circle cx="614" cy="94" r="14" fill="url(#gold)" stroke="#c8860b" stroke-width="3" />
    <ellipse cx="455" cy="188" rx="40" ry="8" fill="#ffffff" opacity="0.35" transform="rotate(-6 455 188)" />
  </g>

  <!-- ظل النص -->
  <g transform="translate(8 13)" fill="none" stroke="rgba(5,13,28,0.5)" stroke-width="92" stroke-linecap="round">
    <path d="M190 645 H380" />
    <path d="M285 645 V900" />
    <path d="M486 700 V900" />
    <circle cx="726" cy="772" r="148" />
    <path d="M796 868 L860 944" />
  </g>
  <circle cx="494" cy="605" r="52" fill="rgba(5,13,28,0.5)" />

  <!-- TiQ -->
  <g fill="none" stroke="#ffffff" stroke-width="92" stroke-linecap="round">
    <path d="M190 645 H380" />
    <path d="M285 645 V900" />
    <path d="M486 700 V900" />
  </g>
  <circle cx="486" cy="592" r="50" fill="#ffffff" />
  <g fill="none" stroke="#7ED957" stroke-width="92" stroke-linecap="round">
    <circle cx="726" cy="772" r="148" />
    <path d="M796 868 L860 944" />
  </g>
</svg>
