<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="0.55" stop-color="#047857"/>
      <stop offset="1" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="ball" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d1fae5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- خطوط وسط الملعب -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="10"/>
  <line x1="256" y1="20" x2="256" y2="492" stroke="#ffffff" stroke-opacity="0.10" stroke-width="8"/>

  <!-- كرة القدم -->
  <g transform="translate(256 236)">
    <circle r="118" fill="url(#ball)"/>
    <circle r="118" fill="none" stroke="#064e3b" stroke-opacity="0.25" stroke-width="6"/>
    <!-- خماسي مركزي -->
    <path d="M0,-46 L44,-14 L27,38 L-27,38 L-44,-14 Z" fill="#064e3b"/>
    <g fill="#064e3b">
      <path d="M0,-118 L26,-84 L0,-46 L-26,-84 Z"/>
      <path d="M104,-36 L112,4 L44,-14 L74,-58 Z"/>
      <path d="M64,98 L26,112 L27,38 L84,52 Z"/>
      <path d="M-64,98 L-26,112 L-27,38 L-84,52 Z"/>
      <path d="M-104,-36 L-112,4 L-44,-14 L-74,-58 Z"/>
    </g>
  </g>

  <!-- علامة استفهام TiQ -->
  <text x="256" y="472" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900"
        fill="#fbbf24" stroke="#064e3b" stroke-width="6" paint-order="stroke">؟</text>
</svg>
