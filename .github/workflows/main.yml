name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # استخراج ملفات ZIP القديمة إن وُجدت (للتوافق مع تاريخ المستودع)
      - name: Extract project files (legacy ZIPs)
        run: |
          shopt -s nullglob
          zip_files=(*.zip)
          if [ ${#zip_files[@]} -gt 0 ]; then
            for zip in "${zip_files[@]}"; do
              echo "📦 Extracting: $zip"
              unzip -o -- "$zip"
              rm -f "$zip"
            done
          else
            echo "ℹ️ No ZIP files found — continuing with repository files."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.ts << 'CAPEOF'
          import type { CapacitorConfig } from '@capacitor/cli';
          const config: CapacitorConfig = {
            appId: 'com.footballquiz.app',
            appName: 'Football Quiz',
            webDir: 'dist',
            server: { androidScheme: 'https' }
          };
          export default config;
          CAPEOF

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Add required Android permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          cp "$MANIFEST" "${MANIFEST}.backup"
          awk '/<application/ {
            print "    <uses-permission android:name=\"android.permission.INTERNET\" />"
            print "    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />"
            print "    <uses-permission android:name=\"android.permission.WAKE_LOCK\" />"
            print "    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />"
            print "    <uses-permission android:name=\"android.permission.SCHEDULE_EXACT_ALARM\" />"
            print "    <uses-permission android:name=\"android.permission.RECEIVE_BOOT_COMPLETED\" />"
            print ""
          }
          { print }' "${MANIFEST}.backup" > "$MANIFEST"
          echo "✅ Android permissions added (incl. notifications + reminders)"

      - name: Setup app icon
        run: |
          npm install -g @capacitor/assets
          mkdir -p resources
          if [ -f "icon.png" ]; then
            cp icon.png resources/icon.png
            echo "✅ Icon found, generating assets..."
            npx @capacitor/assets generate --android
          else
            echo "⚠️ No icon.png found, using default icon"
          fi

      - name: Fix Kotlin dependencies
        run: |
          cat >> android/build.gradle << 'KTEOF'

          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22'
                  }
              }
          }
          KTEOF

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
