name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract project files (legacy ZIPs)
        run: |
          shopt -s nullglob
          zip_files=(*.zip)
          if [ ${#zip_files[@]} -gt 0 ]; then
            for zip in "${zip_files[@]}"; do
              echo "📦 Extracting: $zip"
              unzip -o -- "$zip"
              rm -f "$zip"
            done
          else
            echo "ℹ️ No ZIP files found — continuing with repository files."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.ts << 'CAPEOF'
          import type { CapacitorConfig } from '@capacitor/cli';
          const config: CapacitorConfig = {
            appId: 'com.malek.tiq',
            appName: 'TiQ',
            webDir: 'dist',
            server: { androidScheme: 'https' }
          };
          export default config;
          CAPEOF

      - name: Install Capacitor (v7 stack)
        run: |
          npm install --legacy-peer-deps \
            @capacitor/core@7.4.4 @capacitor/cli@7.4.4 @capacitor/android@7.4.4 \
            @capacitor/app@7.1.2 @capacitor/browser@7.0.5 @capacitor/haptics@7.0.5 \
            @capacitor/local-notifications@7.0.7 @capacitor/preferences@7.0.4

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Add permissions + deep link to AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          cp "$MANIFEST" "${MANIFEST}.backup"

          # 1) أضف الصلاحيات قبل <application>
          awk '/<application/ {
            print "    <uses-permission android:name=\"android.permission.INTERNET\" />"
            print "    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />"
            print "    <uses-permission android:name=\"android.permission.WAKE_LOCK\" />"
            print "    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />"
            print "    <uses-permission android:name=\"android.permission.SCHEDULE_EXACT_ALARM\" />"
            print "    <uses-permission android:name=\"android.permission.RECEIVE_BOOT_COMPLETED\" />"
            print ""
          }
          { print }' "${MANIFEST}.backup" > "$MANIFEST"

          # 2) أضف intent-filter للـ deep link (com.malek.tiq://login-callback)
          #    داخل الـ activity الرئيسية مباشرةً قبل </activity>
          python3 - <<'PYEOF'
          import re

          with open("android/app/src/main/AndroidManifest.xml", "r") as f:
              content = f.read()

          deep_link_filter = """
                  <intent-filter android:autoVerify="true">
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="com.malek.tiq" android:host="login-callback" />
                  </intent-filter>"""

          # أضف قبل إغلاق الـ activity الأولى
          if "com.malek.tiq" not in content:
              content = content.replace("</activity>", deep_link_filter + "\n        </activity>", 1)

          with open("android/app/src/main/AndroidManifest.xml", "w") as f:
              f.write(content)

          print("✅ Deep link intent-filter added")
          PYEOF

          echo "✅ Manifest updated"
          grep -A5 "com.malek.tiq" "$MANIFEST" || echo "(deep link already present)"

      - name: Setup app icon
        run: |
          npm install -g @capacitor/assets
          mkdir -p resources
          if [ -f "resources-icon-1024.png" ]; then
            cp resources-icon-1024.png resources/icon.png
          elif [ -f "icon.png" ]; then
            cp icon.png resources/icon.png
          elif [ -f "public/icon.png" ]; then
            cp public/icon.png resources/icon.png
          else
            echo "⚠️ No icon found, using default"
          fi
          npx @capacitor/assets generate --android

      - name: Fix Kotlin dependencies
        run: |
          cat >> android/build.gradle << 'KTEOF'

          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22'
                  }
              }
          }
          KTEOF

      # توقيع ثابت — نفس المفتاح في كل بناء حتى يبقى SHA-1 ثابتًا لـ Google Sign-In
      - name: Apply stable signing key
        run: |
          cat >> android/app/build.gradle << 'SIGEOF'

          android {
              signingConfigs {
                  tiqKey {
                      storeFile file("../../tiq-release.keystore")
                      storePassword "TiQ-Malek-2026"
                      keyAlias "tiq"
                      keyPassword "TiQ-Malek-2026"
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.tiqKey
                  }
              }
          }
          SIGEOF
          keytool -list -v -keystore tiq-release.keystore -alias tiq -storepass TiQ-Malek-2026 2>/dev/null | grep "SHA1:" | head -1 || true
          echo "✅ Stable signing key applied"

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
