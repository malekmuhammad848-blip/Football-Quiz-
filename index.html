<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#064e3b" />
    <meta
      name="description"
      content="TiQ — سؤال الكرة اليومي: سؤال جديد كل يوم، سلسلة يومية، إشعارات تذكير، ومؤثرات ممتعة."
    />
    <meta property="og:title" content="⚽ TiQ — سؤال الكرة اليومي" />
    <meta property="og:description" content="سؤال جديد كل يوم. حافظ على سلسلتك وكن أسطورة المتابعة!" />
    <meta property="og:type" content="website" />
    <title>⚽ TiQ — سؤال الكرة اليومي</title>
    <script>
      // تطبيق الوضع الداكن قبل الرسم لمنع الوميض (متوافق مع tiq:prefs v3)
      (function () {
        try {
          var dark = null;
          var prefsRaw = localStorage.getItem("tiq:prefs");
          if (prefsRaw) {
            var theme = (JSON.parse(prefsRaw) || {}).theme;
            if (theme === "dark") dark = true;
            else if (theme === "light") dark = false;
          } else {
            var old = localStorage.getItem("fq:theme");
            if (old) {
              var t = JSON.parse(old);
              if (t === "dark") dark = true;
              else if (t === "light") dark = false;
            }
          }
          if (dark === null) {
            dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          }
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
