<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#064e3b" />
    <meta
      name="description"
      content="TiQ — سؤال الكرة اليومي: سؤال جديد كل يوم، سلسلة يومية، إشعارات تذكير، ومؤثرات ممتعة."
    />
    <meta property="og:title" content="⚽ TiQ — سؤال الكرة اليومي" />
    <meta property="og:description" content="سؤال جديد كل يوم. حافظ على سلسلتك وكن أسطورة المتابعة!" />
    <meta property="og:type" content="website" />
    <title>⚽ TiQ — سؤال الكرة اليومي</title>
    <script>
      // تطبيق الوضع الداكن قبل الرسم لمنع الوميض
      (function () {
        try {
          var t = JSON.parse(localStorage.getItem("fq:theme") || '"system"');
          var dark =
            t === "dark" ||
            (t === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
